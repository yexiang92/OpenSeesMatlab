version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install --upgrade pip
      - python -m pip install -r docs/requirements-doc.txt
    build:
      html:
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - python -m zensical build --clean --strict
        - cp -a site/. "$READTHEDOCS_OUTPUT/html/"
