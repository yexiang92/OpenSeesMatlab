site_name: OpenSeesMatlab Documentation
site_url: https://openseesmatlab.readthedocs.io/en/latest/
docs_dir: docs
# Rebuild generated API pages when MATLAB source docstrings change.
watch:
  - OpenSeesMatlab
site_description: "⚡ Documentation for OpenSeesMatlab, a MATLAB interface to the OpenSees program."
site_author: Yexiang Yan
repo_name: yexiang92/OpenSeesMatlab
repo_url: https://github.com/yexiang92/OpenSeesMatlab
# Copyright
copyright: Copyright &copy; 2026 - 2026 Yexiang Yan. All rights reserved.

theme:
  name: material
  variant: modern
  language: en
  logo: static/logo-light.png
  favicon: static/logo2.png
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: Google Sans Code
  # custom_dir: docs/static/overrides
  palette:
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: indigo
      # accent: deep orange
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      # primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      # primary: lime
      # accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to system preference
extra_css:
  - static/stylesheets/extra.css
  # - static/stylesheets/code-theme.css
  - https://unpkg.com/katex@0/dist/katex.min.css

extra_javascript:
  - static/javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yexiang92/OpenSeesMatlab
      name: OpenSeesMatlab on GitHub
    - icon: fontawesome/solid/book-open
      link: https://openseesmatlab.readthedocs.io/
      name: OpenSeesMatlab documentation

markdown_extensions:
  - abbr
  - attr_list
  - admonition
  - footnotes
  - tables
  - md_in_html
  - pymdownx.blocks.admonition
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.blocks.tab:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: false
      line_spans: __span
      use_pygments: true
      pygments_lang_class: true
  - pymdownx.magiclink
  - pymdownx.snippets:
      # auto_append: [docs/.glossary.md]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: "¤"
      toc_depth: 3

plugins:
  - search
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      default_handler: matlab
      handlers:
        matlab:
          paths: ["OpenSeesMatlab"]
          # Keep parser internals quiet; Zensical --strict still reports site errors.
          tree_sitter_logging_level: ERROR
          paths_recursive: true
          options:
            show_inheritance_diagram: false
            show_source: false
            heading_level: 3
            argument_headings: false
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: true
            show_root_members_full_path: false
            show_object_full_path: false
            show_category_heading: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

            hidden_members: false
            private_members: false
            inherited_members: false
            filters: ["!^delete$|^disp$"]
            members_order: "source"
            summary: false
            show_attributes: true

            docstring_style: numpy
            docstring_section_style: list
            parse_arguments: false
            merge_constructor_into_class: false
            show_if_no_docstring: false
            show_docstring_description: true
            show_docstring_examples: true
            show_docstring_input_arguments: true
            show_docstring_name_value_arguments: true
            show_docstring_output_arguments: true

            show_signature: true
            show_signature_types: true
            separate_signature: false
# hooks:
#   - tools/mkdocs_hooks.py
nav:
  - Home: "index.md"

  - Getting Started:
      - OpenSeesMatlab at a Glance: "getting_started/overview.md"
      - Installation: "getting_started/installation.md"
      - Your First Analysis: "getting_started/quickstart.md"
      - OpenSees Command Interface: "getting_started/opensees.md"
      - Pre- and post-processing and visualization: "getting_started/post.md"
      - Extensions: "getting_started/extensions.md"
      - Changelog: "getting_started/changelog.md"

  - Examples:
      - "examples/index.md"
      - Pre, Post-processing and Visualization: "examples/post/index.md"
      - OpenSees command examples: "examples/opscmds/index.md"
      - Extended OpenSees commands by OpenSeesMatlab: "examples/extension/index.md"
      - Verification: "examples/verify/index.md"

  - API Reference:
      - OpenSeesMatlab: "api/OpenSeesMatlab.md"
      - OpenSeesMatlabCmds: "api/OpenSeesMatlabCmds.md"
      - OpenSeesMatlabVis: "api/OpenSeesMatlabVis.md"
      - OpenSeesMatlabVisPolyscope: "api/OpenSeesMatlabVisPolyscope.md"
      - OpenSeesMatlabPost: "api/OpenSeesMatlabPost.md"
      - OpenSeesMatlabPre: "api/OpenSeesMatlabPre.md"
      - OpenSeesMatlabAnalysis: "api/OpenSeesMatlabAnalysis.md"
      - OpenSeesMatlabTool: "api/OpenSeesMatlabTool.md"

  - About Author: "aboutAuthor.md"
