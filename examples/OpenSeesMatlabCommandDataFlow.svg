<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="850" viewBox="0 0 1600 850">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #172033; }
      .head { font: 700 22px Arial, sans-serif; fill: #172033; }
      .body { font: 18px Arial, sans-serif; fill: #344054; }
      .small { font: 16px Arial, sans-serif; fill: #475467; }
      .num { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .box { stroke-width: 2.2; rx: 15; ry: 15; }
      .forward { fill: none; stroke: #2374ab; stroke-width: 4; marker-end: url(#blueArrow); }
      .return { fill: none; stroke: #d97706; stroke-width: 4; marker-end: url(#orangeArrow); }
      .persist { fill: none; stroke: #38845b; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#greenArrow); }
    </style>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2374ab"/></marker>
    <marker id="orangeArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#38845b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#101828" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="850" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" class="title">In-process command and response workflow</text>

  <!-- Forward path boxes -->
  <g filter="url(#shadow)">
    <rect x="70" y="155" width="245" height="150" class="box" fill="#eaf3fb" stroke="#2374ab"/>
    <rect x="370" y="155" width="245" height="150" class="box" fill="#f2ecfb" stroke="#7856a8"/>
    <rect x="670" y="155" width="245" height="150" class="box" fill="#f2ecfb" stroke="#7856a8"/>
    <rect x="970" y="155" width="245" height="150" class="box" fill="#fff3e6" stroke="#d97706"/>
    <rect x="1270" y="155" width="260" height="150" class="box" fill="#eaf7ef" stroke="#38845b"/>
  </g>
  <g>
    <circle cx="104" cy="185" r="20" fill="#2374ab"/><text x="104" y="192" text-anchor="middle" class="num">1</text>
    <circle cx="404" cy="185" r="20" fill="#7856a8"/><text x="404" y="192" text-anchor="middle" class="num">2</text>
    <circle cx="704" cy="185" r="20" fill="#7856a8"/><text x="704" y="192" text-anchor="middle" class="num">3</text>
    <circle cx="1004" cy="185" r="20" fill="#d97706"/><text x="1004" y="192" text-anchor="middle" class="num">4</text>
    <circle cx="1304" cy="185" r="20" fill="#38845b"/><text x="1304" y="192" text-anchor="middle" class="num">5</text>
  </g>
  <text x="193" y="213" text-anchor="middle" class="head">MATLAB call</text>
  <text x="193" y="246" text-anchor="middle" class="body">command name</text><text x="193" y="273" text-anchor="middle" class="body">native arrays and cells</text>
  <text x="493" y="213" text-anchor="middle" class="head">MEX dispatch</text>
  <text x="493" y="246" text-anchor="middle" class="body">select built-in or</text><text x="493" y="273" text-anchor="middle" class="body">extension command</text>
  <text x="793" y="213" text-anchor="middle" class="head">Argument binding</text>
  <text x="793" y="246" text-anchor="middle" class="body">MATLAB types to</text><text x="793" y="273" text-anchor="middle" class="body">OPS argument stream</text>
  <text x="1093" y="213" text-anchor="middle" class="head">Native command</text>
  <text x="1093" y="246" text-anchor="middle" class="body">upstream OpenSees or</text><text x="1093" y="273" text-anchor="middle" class="body">registered extension</text>
  <text x="1400" y="213" text-anchor="middle" class="head">Shared Domain</text>
  <text x="1400" y="246" text-anchor="middle" class="body">update model state or</text><text x="1400" y="273" text-anchor="middle" class="body">execute analysis</text>

  <path d="M315 230 L358 230" class="forward"/>
  <path d="M615 230 L658 230" class="forward"/>
  <path d="M915 230 L958 230" class="forward"/>
  <path d="M1215 230 L1258 230" class="forward"/>
  <text x="800" y="120" text-anchor="middle" class="head" fill="#2374ab">Command path</text>

  <!-- Persistent state -->
  <rect x="1185" y="390" width="345" height="122" class="box" fill="#effaf3" stroke="#38845b" stroke-width="2.2"/>
  <text x="1358" y="428" text-anchor="middle" class="head">Persistent analysis state</text>
  <text x="1358" y="460" text-anchor="middle" class="body">domain remains in memory</text>
  <text x="1358" y="487" text-anchor="middle" class="body">between successive MEX calls</text>
  <path d="M1400 305 L1400 378" class="persist"/>

  <!-- Return path -->
  <g filter="url(#shadow)">
    <rect x="70" y="610" width="285" height="135" class="box" fill="#eaf3fb" stroke="#2374ab"/>
    <rect x="445" y="610" width="285" height="135" class="box" fill="#fff3e6" stroke="#d97706"/>
    <rect x="820" y="610" width="285" height="135" class="box" fill="#f4f6f8" stroke="#667085"/>
    <rect x="1195" y="610" width="335" height="135" class="box" fill="#eaf7ef" stroke="#38845b"/>
  </g>
  <text x="213" y="655" text-anchor="middle" class="head">MATLAB workflow</text>
  <text x="213" y="688" text-anchor="middle" class="body">processing • decisions</text><text x="213" y="715" text-anchor="middle" class="body">visualization • next call</text>
  <text x="588" y="655" text-anchor="middle" class="head">Output conversion</text>
  <text x="588" y="688" text-anchor="middle" class="body">OPS results and status</text><text x="588" y="715" text-anchor="middle" class="body">to MATLAB arrays</text>
  <text x="963" y="655" text-anchor="middle" class="head">Response selection</text>
  <text x="963" y="688" text-anchor="middle" class="body">direct query or</text><text x="963" y="715" text-anchor="middle" class="body">structured recording</text>
  <text x="1363" y="655" text-anchor="middle" class="head">Computed response</text>
  <text x="1363" y="688" text-anchor="middle" class="body">displacement • force • state</text><text x="1363" y="715" text-anchor="middle" class="body">convergence • recorder data</text>
  <path d="M1195 677 L1117 677" class="return"/>
  <path d="M820 677 L742 677" class="return"/>
  <path d="M445 677 L367 677" class="return"/>
  <path d="M1363 512 L1363 598" class="return"/>
  <text x="800" y="575" text-anchor="middle" class="head" fill="#d97706">Response path</text>

  <!-- Feedback loop -->
  <path d="M213 610 C213 535 193 462 193 317" class="forward" stroke-dasharray="10 8"/>
  <text x="224" y="467" class="small">step-by-step feedback</text>
  <text x="224" y="492" class="small">without process restart</text>

  <text x="800" y="815" text-anchor="middle" class="small">Model construction, analysis control, response queries, and MATLAB calculations operate on one in-memory OpenSees model.</text>
</svg>
